# Default (non-checkpoint) shape model — used when no local checkpoint below is configured.
model_path: tencent/Hunyuan3D-2mini #tencent/Hunyuan3D-2.1
subfolder: hunyuan3d-vae-v2-mini-withencoder #hunyuan3d-dit-v2-1
device: cuda
use_safetensors: false
variant: fp16

# Local fine-tuned checkpoint. When both paths exist on disk, shape generation
# uses Hunyuan3DDiTFlowMatchingPipelineInAlighnedSpace with these custom
# weights instead of the default model_path/subfolder above.
# checkpoint_config_path is a *training*-shaped config (denoiser_cfg nested,
# e.g. hy3dshape/configs/*.yaml)
checkpoint_path: null
checkpoint_config_path: null
checkpoint_base_model_path: tencent/Hunyuan3D-2mini
checkpoint_base_subfolder: hunyuan3d-dit-v2-mini
checkpoint_use_peft: true

# Relocated module-level flags (both hardcoded `False` in the vendored source
# today) — pipelines.py::TEST (from_single_file's conditioner-loading branch),
# hunyuan3ddit.py::TEST (currently unread there), pipelines.py::USE_PRIOR_TR
# (AlignedSpace's prior-blending branch).
test_mode: true
use_prior_tr: true

# Shape sampling parameters
num_inference_steps: 50
guidance_scale: 5.0
octree_resolution: 384
num_chunks: 8000
mc_algo: null
seed: 43

# Prior mesh (shape-initialization)
prior_path: null   # e.g. "cover_prior.obj"
prior_alpha: 0.5

low_vram_mode: false
enable_flashvdm: false
compile: false

# Texture painting (Hunyuan3DPaintPipeline)
enable_texture: true
paint_max_num_view: 6
paint_resolution: 512
realesrgan_ckpt_path: hy3dpaint/ckpt/RealESRGAN_x4plus.pth
multiview_cfg_path: hy3dpaint/cfgs/hunyuan-paint-pbr.yaml
paint_custom_pipeline: hunyuanpaintpbr

# Scratch directory for intermediate glb/obj files (trimesh export + the
# obj->glb PBR conversion tool both work via file paths, not in-memory).
# null -> a system temp dir per call
scratch_dir: null
